# 按 Fcitx5 官方 Wayland 文档对 KDE Plasma 的建议，只设 XMODIFIERS:它对 X11 与 XWayland 应用
# 必需，且不影响 Wayland 原生应用。
# 刻意不设 GTK_IM_MODULE、QT_IM_MODULE 与 SDL_IM_MODULE:KDE Wayland 下 GTK3、GTK4 与 Qt6 走 KWin
# 原生 text-input 协议，设了会盖掉它并触发候选窗口闪烁。GTK 在 X11 与 XWayland 下的覆盖改由
# gtk-3.0 与 gtk-4.0 的 settings.ini 承担。
XMODIFIERS=@im=fcitx
