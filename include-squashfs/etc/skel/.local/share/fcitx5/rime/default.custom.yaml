# Rime 全局方案预置，新建用户与 live 用户经 /etc/skel 继承。
# 以下方案分别由 rime-data 的 rime-luna-pinyin、rime-bopomofo、rime-wubi、rime-cangjie、
# rime-cantonese 组件提供，缺少对应组件时该方案不可用。
patch:
  schema_list:
    - schema: luna_pinyin        # 朙月拼音（默认，简体拼音）
    - schema: bopomofo           # 注音（繁体台湾）
    - schema: wubi86             # 五笔 86
    - schema: cangjie5           # 仓颉五代
    - schema: jyut6ping3         # 粤拼（粤语，rime-cantonese）
  menu/page_size: 7
